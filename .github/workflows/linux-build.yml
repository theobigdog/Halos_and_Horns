# Builds the native Linux version of the game.
#
# - When a release is published, the build is attached to it as
#   HalosAndHorns.x86_64, next to the Windows .exe.
# - It can also be run by hand from the Actions tab; the build is then
#   available as a downloadable artifact on the run page.
name: Linux build

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # Must match the Godot version the project is made with (see project.godot).
  GODOT_VERSION: "4.3"

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to attach the build to the release
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and its Linux export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -j templates.tpz templates/version.txt templates/linux_release.x86_64 -d "$templates"
          rm godot.zip templates.tpz
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Export the Linux build
        run: |
          mkdir -p builds
          "$GODOT" --headless --export-release "Linux" builds/HalosAndHorns.x86_64
          test -s builds/HalosAndHorns.x86_64
          chmod +x builds/HalosAndHorns.x86_64

      - name: Check the build starts
        run: timeout 60 builds/HalosAndHorns.x86_64 --headless --quit-after 10

      - uses: actions/upload-artifact@v4
        with:
          name: HalosAndHorns-linux
          path: builds/HalosAndHorns.x86_64

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" builds/HalosAndHorns.x86_64 --clobber
